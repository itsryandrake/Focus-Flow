<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FocusMode - Curated Music for Focus, Meditation & Productivity</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Curated music for focus, meditation, and productivity. Boost concentration with scientifically-designed soundscapes for deep work, relaxation, and sleep. Free focus music app." />
    <meta name="keywords" content="focus music, concentration music, productivity music, meditation sounds, ambient music, study music, work music, deep focus, binaural beats, lo-fi, sleep sounds" />
    <meta name="author" content="Ential" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://focusmode.cc/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://focusmode.cc/" />
    <meta property="og:title" content="FocusMode - Music for Focus & Productivity" />
    <meta property="og:description" content="Curated music for focus, meditation, and productivity. Boost concentration with scientifically-designed soundscapes." />
    <meta property="og:image" content="https://focusmode.cc/og-image.png" />
    <meta property="og:site_name" content="FocusMode" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://focusmode.cc/" />
    <meta name="twitter:title" content="FocusMode - Focus Music App" />
    <meta name="twitter:description" content="Curated music for focus, meditation, and productivity. Free focus music app." />
    <meta name="twitter:image" content="https://focusmode.cc/og-image.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#F74603" />
    <meta name="msapplication-TileColor" content="#F74603" />

    <!-- App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "FocusMode",
      "description": "Curated music for focus, meditation, and productivity with scientifically-designed soundscapes",
      "url": "https://focusmode.cc/",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Organization",
        "name": "Ential",
        "url": "https://ential.com"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[var(--bg-primary)] text-[var(--text-primary)] antialiased selection:bg-[#F74603]/20 selection:text-[#F74603] transition-colors">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
